    <!--
      Pre-paint: runs before the first paint so nothing flashes.
      - 'amd' turns on the equal-measure lockup; it is removed again if the inline font
        cannot be used (web fonts blocked), leaving the safe, wrapping fallback styles.
      - data-theme: dark for everyone unless light was explicitly saved.
      - 'intro': the first page view of a session plays the name lock-in and colour bloom,
        except under reduced motion or Save-Data.
      - 'js': scripts run, so disclosures (case studies, "Read as text") start closed and
        their buttons show. Without it, that content is simply printed open.
    -->
    <script>
      (function () {
        var d = document.documentElement;
        var font = '860 20px "AM Display"';
        d.classList.add('js', 'amd');

        var theme = 'dark';
        try {
          if (localStorage.getItem('theme') === 'light') theme = 'light';
        } catch (e) {}
        d.setAttribute('data-theme', theme);
        if (theme === 'light') {
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', '#F7F7F5');
        }

        // A link into the page (#work/tricore) jumps straight there on load instead of
        // smooth-scrolling past everything above it. Smooth scrolling returns with the
        // visitor's first interaction.
        if (location.hash.length > 1) {
          var events = ['pointerdown', 'keydown', 'wheel', 'touchstart'];
          var unjump = function () {
            d.classList.remove('jump');
            events.forEach(function (t) {
              removeEventListener(t, unjump, true);
            });
          };
          d.classList.add('jump');
          events.forEach(function (t) {
            addEventListener(t, unjump, true);
          });
        }

        // Saved preferences: 'am:prefs' holds the in-page Reduce motion and Hide status bar.
        var inPageReduce = false;
        try {
          var prefs = JSON.parse(localStorage.getItem('am:prefs') || '{}');
          if (prefs.reduceMotion === true) {
            inPageReduce = true;
            d.classList.add('rm');
          }
          if (prefs.hideStatusBar === true) d.classList.add('sb-hidden');
        } catch (e) {}

        try {
          var reduce = inPageReduce || (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
          var saveData = navigator.connection && navigator.connection.saveData;
          if (!sessionStorage.getItem('am:intro')) {
            sessionStorage.setItem('am:intro', '1');
            if (!reduce && !saveData) d.classList.add('intro');
          }
        } catch (e) {}

        var fonts = document.fonts;
        if (fonts && fonts.load) {
          var fail = function () {
            d.classList.remove('amd');
          };
          fonts
            .load(font)
            .then(function (faces) {
              return fonts.ready.then(function () {
                if (!faces.length || !fonts.check(font)) fail();
              });
            })
            .catch(fail);
        }
      })();
    </script>
