<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Aslam Muhammed — .NET Developer & IT Systems Engineer</title>
    <meta name="description" content="Aslam Muhammed — .NET Developer and IT Systems Engineer based in Abu Dhabi. Building enterprise retail systems, full-stack applications, and reliable infrastructure." />
    <meta name="keywords" content="Aslam Muhammed, .NET Developer, IT Systems Engineer, C#, ASP.NET, React, SQL Server, Abu Dhabi" />
    <meta name="author" content="Aslam Muhammed" />
    <meta name="theme-color" content="#0A0C10" />

    <!-- Open Graph / social -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Aslam Muhammed — .NET Developer & IT Systems Engineer" />
    <meta property="og:description" content="Building enterprise retail systems, full-stack applications, and reliable infrastructure — from Abu Dhabi." />
    <meta property="og:url" content="https://portfolio.aslammhdms.workers.dev/" />
    <meta property="og:image" content="https://portfolio.aslammhdms.workers.dev/images/aslam.jpg" />
    <meta name="twitter:card" content="summary" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Preload the hero scene poster so the first cinematic frame paints fast -->
    <link rel="preload" as="image" href="/videos/hero.poster.webp" type="image/webp" />

    <!-- Set the theme class before paint to avoid a flash of the wrong theme -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (t !== 'light' && t !== 'dark') t = 'dark'; // dark-first
          document.documentElement.classList.remove('light', 'dark');
          document.documentElement.classList.add(t);
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>

    <!-- Fonts: Space Grotesk (display), Inter (body), JetBrains Mono (code/labels) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>
</html>
