# Cloudflare Workers — static-assets-only deployment.
# Cloudflare runs the build command (`npm run build`) to produce ./dist,
# then `npx wrangler deploy` ships it using this config. No Worker script
# is needed; `[assets]` with no `main` serves the built site directly.
name = "portfolio"
compatibility_date = "2025-01-01"

[assets]
directory = "./dist"
# Unknown paths get the prerendered dist/404.html ('command not found: /path') with a 404
# status. Links into the page use the hash (/#work/tricore), so they are unaffected.
not_found_handling = "404-page"
