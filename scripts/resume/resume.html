<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title><!--TITLE--></title>
    <style>
      @font-face {
        font-family: 'Mona Sans';
        src: url('/*MONA*/') format('woff2');
        font-weight: 200 900;
      }
      @page {
        size: A4;
        margin: 15mm 17mm 14mm;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font: 400 9.6pt/1.45 'Mona Sans', Arial, sans-serif;
        color: #1a1a1a;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      h1 {
        font-size: 27pt;
        font-weight: 800;
        line-height: 1;
        letter-spacing: -0.02em;
        color: #111;
      }
      .title {
        margin-top: 2.2mm;
        font-size: 11.5pt;
        font-weight: 600;
        color: #a92a68;
      }
      .contact {
        margin-top: 2.6mm;
        color: #444;
        line-height: 1.55;
      }
      h2 {
        margin: 6mm 0 2.2mm;
        padding-bottom: 1.2mm;
        border-bottom: 0.6pt solid #bbb;
        font-size: 8.4pt;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #111;
        break-after: avoid;
      }
      .job {
        margin-top: 3.4mm;
        break-inside: avoid;
      }
      .job:first-of-type {
        margin-top: 0;
      }
      h3,
      .row {
        display: flex;
        justify-content: space-between;
        gap: 6mm;
        font-size: 9.6pt;
        font-weight: 400;
      }
      strong {
        font-weight: 650;
        color: #111;
      }
      .dates {
        flex: none;
        color: #555;
        font-variant-numeric: tabular-nums;
      }
      ul {
        margin-top: 1.2mm;
        padding-left: 4.2mm;
      }
      li {
        margin-top: 0.7mm;
        padding-left: 0.8mm;
      }
      li::marker {
        color: #a92a68;
      }
      .project {
        margin-top: 2.6mm;
        break-inside: avoid;
      }
      .project:first-of-type {
        margin-top: 0;
      }
      .stack {
        color: #555;
        font-size: 8.8pt;
      }
      .skills {
        list-style: none;
        padding-left: 0;
        margin-top: 0;
      }
      .skills li {
        padding-left: 0;
      }
    </style>
  </head>
  <body>
    <!--BODY-->
  </body>
</html>
