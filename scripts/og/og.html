<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>og</title>
<!-- Link-preview card (1200x630): the name lockup and the title, nothing else, centred.
     Rendered by scripts/build-og.mjs, which fills the two placeholders below with the
     inline AM Display face and the file URL of Mona Sans. Same tokens and the same
     measures as the hero (hero.css), dark theme. -->
<style>
/*AM_DISPLAY*/
@font-face {
  font-family: 'Mona Sans Variable';
  src: url('/*MONA*/') format('woff2');
  font-weight: 200 900;
  font-stretch: 75% 125%;
}
* { box-sizing: border-box; margin: 0; }
html, body { width: 1200px; height: 630px; overflow: hidden; background: #131313; color: #EDEDEA; }
.card { width: 1200px; height: 630px; display: flex; align-items: center; justify-content: center; }
/* 840px measure: the name is 840 / 3.595 and the role 840 / 17.909, so both end on one edge. */
.lockup { width: 840px; }
.name { font-family: 'AM Display'; font-size: calc(840px / 3.595); font-weight: 400; line-height: 0.88; font-synthesis: none;
  margin-top: -0.096em; margin-bottom: -0.055em; }
.name span { display: block; white-space: nowrap; }
.l1 { font-stretch: 125%; font-weight: 860; margin-left: 0.006em; }
.l2 { font-stretch: 75%; font-weight: 419; margin-left: -0.055em; }
.role { margin-top: calc(840px * 0.044); margin-left: -0.03em; font-family: 'Mona Sans Variable'; font-size: calc(840px / 17.909);
  font-weight: 500; line-height: 1.2; white-space: nowrap; }
</style>
</head>
<body>
<div class="card">
  <div class="lockup">
    <h1 class="name"><span class="l1">Aslam</span><span class="l2">Muhammed</span></h1>
    <p class="role">Software Engineer · .NET &amp; IT Systems</p>
  </div>
</div>
</body>
</html>
